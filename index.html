<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Editor: Cutout &amp; Blur</title>
<meta name="description" content="Photo Editor – cut out a person, blur the background, collage and edit photos on your Android phone.">
<style>
  :root { --brand: #4C6FFF; --brand-dark: #3348D6; --text: #1A1F36; --muted: #5B6478; --bg: #F3F6FA; }
  @media (prefers-color-scheme: dark) { :root { --text: #F4F1EA; --muted: #9AA3AD; --bg: #121417; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; padding: 24px 16px; }
  main { text-align: center; max-width: 420px; }
  .logo { width: 96px; height: 96px; border-radius: 24px; margin: 0 auto 20px; display: grid; place-items: center;
    background: linear-gradient(135deg, #2F45C8, var(--brand) 55%, #7C4DFF); }
  h1 { margin: 0 0 4px; font-size: 28px; }
  p { margin: 0 0 24px; color: var(--muted); }
  a { color: var(--brand-dark); font-weight: 600; }
  @media (prefers-color-scheme: dark) { a { color: var(--brand); } }
  nav { display: flex; gap: 20px; justify-content: center; font-size: 15px; }
</style>

<main>
  <div class="logo" aria-hidden="true">

</html>
